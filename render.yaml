# Render.com için tek tıkla deploy tanımı.
# Render hesabında "New > Blueprint" ile bu repoyu bağladığında otomatik okunur.
services:
  - type: web
    name: discord-archive-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /
    envVars:
      # DISCORD_WEBHOOK_URL'i Render panelinden (gizli) gir — repoya yazma.
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: BOT_USERNAME
        value: Drakkar Archive
      # Avatar için kalıcı bir https URL girersen panelden gir; yoksa webhook'a yüklediğin avatar kullanılır.
      - key: BOT_AVATAR_URL
        sync: false
      # Güvenlik açmak istediğinde panelden doldur (boşsa kapalı).
      - key: CALLBACK_SECRET
        sync: false
      # Forum etiketleri + Trending için Bot Token ve forum kanal ID'si (gizli, panelden gir).
      - key: BOT_TOKEN
        sync: false
      - key: FORUM_CHANNEL_ID
        sync: false
      # Trending ayarları (varsayılanlar yeterli; istersen değiştir).
      - key: TRENDING_TAG_NAME
        value: Trending
      - key: TRENDING_TOP_N
        value: "10"
      - key: TRENDING_INTERVAL_MIN
        value: "30"
