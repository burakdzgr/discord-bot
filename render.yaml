# Render.com için tek tıkla deploy tanımı.
# Render hesabında "New > Blueprint" ile bu repoyu bağladığında otomatik okunur.
services:
  - type: web
    name: discord-archive-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /
    envVars:
      # Varsayılan webhook (type eşleşmezse buraya düşer). Panelden gir.
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: FORUM_CHANNEL_ID
        sync: false
      # ── Tür bazlı kanallar (her birini panelden gir) ──
      - key: MOVIE_WEBHOOK_URL
        sync: false
      - key: MOVIE_CHANNEL_ID
        sync: false
      - key: SERIES_WEBHOOK_URL
        sync: false
      - key: SERIES_CHANNEL_ID
        sync: false
      - key: ANIME_WEBHOOK_URL
        sync: false
      - key: ANIME_CHANNEL_ID
        sync: false
      - key: ADULT_WEBHOOK_URL
        sync: false
      - key: ADULT_CHANNEL_ID
        sync: false
      - key: BOT_USERNAME
        value: Drakkar Archive
      # Avatar için kalıcı bir https URL girersen panelden gir; yoksa webhook'a yüklediğin avatar kullanılır.
      - key: BOT_AVATAR_URL
        sync: false
      # Güvenlik açmak istediğinde panelden doldur (boşsa kapalı).
      - key: CALLBACK_SECRET
        sync: false
      # Tek Bot Token tüm kanalları yönetir (gizli, panelden gir).
      - key: BOT_TOKEN
        sync: false
      # Trending ayarları (varsayılanlar yeterli; istersen değiştir).
      - key: TRENDING_TAG_NAME
        value: Trending
      - key: TRENDING_TOP_N
        value: "10"
      - key: TRENDING_INTERVAL_MIN
        value: "30"
      # JPV video API'sinden otomatik çekme (e-posta+şifre gizli, panelden gir).
      - key: JPV_EMAIL
        sync: false
      - key: JPV_PASSWORD
        sync: false
      - key: JPV_API_BASE
        value: https://japierdolevid.com/api/v1
      - key: JPV_POLL_MIN
        value: "5"
      - key: JPV_TYPES
        value: movie:Movie,series:Series
